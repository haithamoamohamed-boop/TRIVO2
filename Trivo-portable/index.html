<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRIVO</title><meta name="theme-color" content="#0a0a0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TRIVO"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"><style id="trivo-css">
/* TRIVO lime — dark-first, one type family (Archivo). Layout: centred 780px column, glass header, floating pill tab bar; full-bleed media heroes. */
:root {
  --bg: #0a0a0a; --surface: #131313; --surface-2: #1b1b1b; --glass: rgba(12, 12, 12, .78); --line: #2a2a2a; --ink: #f4f4f0; --muted: #9b9b93;
  --lime: #c6f432; --accent: #c6f432; --accent-2: #c6f432; --accent-soft: rgba(198, 244, 50, .12); --on-accent: #0a0a0a;
  --swim: #3ec7f2; --bike: #ffb020; --run: #ff5b4a; --gym: #b18cff; --race: #c6f432; --rest: #6b6b66;
  --good: #34d399; --warn: #ffb020; --bad: #ff5b4a; --good-soft: rgba(52, 211, 153, .14); --warn-soft: rgba(255, 176, 32, .14); --bad-soft: rgba(255, 91, 74, .15);
  --glow-a: rgba(198, 244, 50, .06); --glow-b: rgba(255, 255, 255, .025);
  --shadow: 0 12px 32px -16px rgba(0, 0, 0, .8);
  --f-display: "Archivo", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --r-sm: 10px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f5f6f1; --surface: #ffffff; --surface-2: #eef0e8; --glass: rgba(255, 255, 255, .84); --line: #dfe2d6; --ink: #0a0a0a; --muted: #5d6155;
  --lime: #c6f432; --accent: #8fbf12; --accent-2: #4a6b06; --accent-soft: rgba(143, 191, 18, .14); --on-accent: #0a0a0a;
  --swim: #0e9bd0; --bike: #d48806; --run: #e5402c; --gym: #7c3aed; --race: #4a6b06; --rest: #6b6b66;
  --good: #059669; --warn: #b45309; --bad: #dc2626; --good-soft: rgba(5, 150, 105, .1); --warn-soft: rgba(217, 119, 6, .12); --bad-soft: rgba(220, 38, 38, .1);
  --glow-a: rgba(143, 191, 18, .07); --glow-b: rgba(0, 0, 0, .02); --shadow: 0 10px 26px -16px rgba(10, 10, 10, .35); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f5f6f1; --surface: #ffffff; --surface-2: #eef0e8; --glass: rgba(255, 255, 255, .84); --line: #dfe2d6; --ink: #0a0a0a; --muted: #5d6155;
  --lime: #c6f432; --accent: #8fbf12; --accent-2: #4a6b06; --accent-soft: rgba(143, 191, 18, .14); --on-accent: #0a0a0a;
  --swim: #0e9bd0; --bike: #d48806; --run: #e5402c; --gym: #7c3aed; --race: #4a6b06; --rest: #6b6b66;
  --good: #059669; --warn: #b45309; --bad: #dc2626; --good-soft: rgba(5, 150, 105, .1); --warn-soft: rgba(217, 119, 6, .12); --bad-soft: rgba(220, 38, 38, .1);
  --glow-a: rgba(143, 191, 18, .07); --glow-b: rgba(0, 0, 0, .02); --shadow: 0 10px 26px -16px rgba(10, 10, 10, .35); color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; min-height: 100vh;
  background: radial-gradient(900px 500px at -10% -10%, var(--glow-a), transparent 60%), radial-gradient(800px 600px at 110% 110%, var(--glow-b), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 900; font-stretch: 108%; letter-spacing: -.005em; line-height: .98; margin: 0; text-wrap: balance; text-transform: uppercase; }
h1 { font-size: 40px; } h2 { font-size: 26px; } h3 { font-size: 20px; }
p { margin: 0; }
a { color: var(--accent); }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 8px; }
.grad-text, .lime { color: var(--accent-2); }
:root:not([data-theme="light"]) .grad-text { color: var(--lime); }

/* shell */
.app { max-width: 780px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.brand { font: 900 22px/1 var(--f-display); font-stretch: 112%; letter-spacing: .12em; cursor: pointer; background: none; border: 0; color: inherit; padding: 0; display: flex; align-items: center; gap: 9px; text-transform: uppercase; }
.brand svg { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.top .spacer { flex: 1; }
.chip-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 46vw; }
.chip-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--rest); flex: none; }
.sync.ok { background: var(--good); box-shadow: 0 0 10px var(--good); } .sync.local { background: var(--warn); box-shadow: 0 0 10px var(--warn); } .sync.err { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 20px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; pointer-events: none;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tabs-in { pointer-events: auto; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 4px; }
.tab { background: none; border: 0; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 16px; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.tab[aria-current="page"] svg { color: var(--accent-2); filter: drop-shadow(0 0 6px var(--accent-2)); }

/* lane line: swim / bike / run stripe */
.lane { height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--swim) 0 18px, var(--bike) 18px 36px, var(--run) 36px 54px, transparent 54px 60px); }

/* blocks */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card { background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 88%, var(--bg))); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .duo { grid-template-columns: 1fr; } }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; text-align: right; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; transition: transform .12s, border-color .12s, box-shadow .12s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(120deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 22px -8px var(--accent); }
.btn.go { background: var(--sc); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 20px -8px var(--sc); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-2); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row.end { justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

/* sport colouring */
.s-swim { --sc: var(--swim); } .s-bike { --sc: var(--bike); } .s-run { --sc: var(--run); } .s-gym { --sc: var(--gym); } .s-race { --sc: var(--race); } .s-other { --sc: var(--rest); }
.sicon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sc) 35%, transparent), 0 0 18px -6px var(--sc); }
.sicon svg { width: 22px; height: 22px; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.hero h1 { font-size: 44px; }
.bigcount { text-align: right; }
.bigcount .n { font: 800 78px/0.85 var(--f-display); letter-spacing: -.01em; }
.bigcount .l { font: 700 11px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.rings-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.rings { width: 132px; height: 132px; flex: none; }
.ring-legend { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ring-legend div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.ring-legend b { font-family: var(--f-data); font-weight: 500; margin-left: auto; font-size: 13px; }
.ring-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 8px var(--sc); flex: none; }
@media (max-width: 380px) { .rings { width: 110px; height: 110px; } .bigcount .n { font-size: 62px; } .hero h1 { font-size: 36px; } }

/* session cards */
.sess { display: grid; grid-template-columns: auto 1fr; gap: 14px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--sc) 14%, var(--surface)), var(--surface) 55%);
  border-color: color-mix(in srgb, var(--sc) 35%, var(--line)); box-shadow: var(--shadow), 0 0 36px -22px var(--sc); }
.sess::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sc); box-shadow: 0 0 14px var(--sc); }
.sess-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sess-title { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.sess-title h3 { font-size: 24px; }
.sess-title .dur { font: 800 26px/1 var(--f-display); color: var(--sc); white-space: nowrap; }
.sess-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; }
.steps li::marker { color: var(--sc); font-weight: 700; }
.fuel { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.sess.is-done { opacity: .72; }
.sess.is-skipped, .sess.is-cut, .sess.is-missed, .sess.is-moved { opacity: .5; }
.sess.is-skipped h3, .sess.is-cut h3, .sess.is-moved h3 { text-decoration: line-through; }
.note { font-size: 13.5px; padding: 9px 11px; border-radius: 10px; background: var(--warn-soft); }
.note.info { background: var(--accent-soft); }

/* plan rows */
.day { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day-l { display: flex; flex-direction: column; }
.day-l b { font: 800 20px/1 var(--f-display); text-transform: uppercase; }
.day-l span { font-size: 12px; color: var(--muted); }
.day.today .day-l b { color: var(--accent-2); text-shadow: 0 0 12px var(--accent-2); }
.day-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.srow { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 10%, var(--surface-2)), var(--surface-2) 60%); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px 9px 0; cursor: pointer; text-align: left; width: 100%; }
.srow::before { content: ""; align-self: stretch; background: var(--sc); border-radius: 0 3px 3px 0; box-shadow: 0 0 10px var(--sc); }
.srow:hover { border-color: color-mix(in srgb, var(--sc) 50%, var(--line)); }
.srow .t { min-width: 0; }
.srow .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .t span { font-size: 12.5px; color: var(--muted); }
.srow .r { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12.5px; }
.srow .r > b { font: 700 16px/1 var(--f-display); color: var(--sc); }
.srow.is-done { opacity: .78; } .srow.is-skipped, .srow.is-cut, .srow.is-missed, .srow.is-moved { opacity: .45; }
.rest-day { font-size: 13px; color: var(--muted); padding: 6px 0; }

/* phase timeline */
.timeline { display: flex; gap: 3px; height: 26px; align-items: stretch; }
.timeline i { flex: 1; border-radius: 4px; min-width: 3px; cursor: pointer; border: 0; padding: 0; }
.timeline i.cur { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 14px var(--accent-2); }
.ph-base { background: color-mix(in srgb, var(--swim) 70%, transparent); }
.ph-build { background: color-mix(in srgb, var(--bike) 80%, transparent); }
.ph-peak { background: var(--run); }
.ph-taper, .ph-race { background: var(--race); }
.ph-deload, .ph-test { background: color-mix(in srgb, var(--rest) 55%, transparent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }

/* stats */
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font: 800 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .v small { font: 600 13px var(--f-body); color: var(--muted); margin-left: 3px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--swim), var(--bike), var(--run)); border-radius: 4px; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); padding: 6px 0; border-radius: 12px; }
.wd .dots { display: flex; gap: 3px; min-height: 9px; }
.wd .dots .dot { width: 8px; height: 8px; background: var(--sc); box-shadow: 0 0 6px var(--sc); }
.wd .dots .dot.open { background: transparent; border: 1.5px solid var(--sc); box-shadow: none; }
.wd.today { background: var(--accent-soft); }
.wd.today b { color: var(--accent-2); }
.wd b { font: 800 18px/1 var(--f-display); color: var(--ink); }

/* readiness */
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.s11 { grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 0; font-weight: 700; cursor: pointer; font-family: var(--f-data); }
.scale button[aria-pressed="true"] { background: linear-gradient(120deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); }
.scale-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.ring { width: 72px; height: 72px; flex: none; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], input[type="url"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; padding: 9px 12px; min-height: 44px; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 0; border-color: transparent; }
input[type="file"] { max-width: 100%; }
.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.goal-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.goal-cards button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.goal-cards button b { font: 800 19px/1.05 var(--f-display); text-transform: uppercase; }
.goal-cards button span { font-size: 12px; color: var(--muted); }
.goal-cards button svg { width: 24px; height: 24px; color: var(--sc); }
.goal-cards button[aria-pressed="true"] { border-color: var(--sc, var(--accent)); box-shadow: inset 0 0 0 1px var(--sc, var(--accent)), 0 0 22px -10px var(--sc, var(--accent)); background: color-mix(in srgb, var(--sc, var(--accent)) 12%, var(--surface-2)); }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--accent-2); flex: none; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(2, 4, 8, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; box-shadow: var(--shadow);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); max-height: 88vh; } }
.sheet-head { position: sticky; top: 0; background: var(--bg); padding: 16px 0 12px; display: flex; align-items: center; gap: 10px; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 24px; }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
.x { border: 1px solid var(--line); background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1; }
.wiz-steps { display: flex; gap: 4px; }
.wiz-steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.wiz-steps i.on { background: linear-gradient(90deg, var(--swim), var(--bike), var(--run)); }

/* toast */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px; width: min(560px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: var(--shadow); }

/* banners */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); } .banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); } .banner.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.banner .b-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.banner b { font-weight: 700; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 17px var(--f-data); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-wrap { overflow-x: auto; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .t { min-width: 0; }
.li .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t span { font-size: 12.5px; color: var(--muted); }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.menu-grid button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.menu-grid button:hover { border-color: var(--accent); }
.menu-grid button b { font: 800 20px/1.05 var(--f-display); text-transform: uppercase; }
.menu-grid button span { font-size: 12.5px; color: var(--muted); }
.menu-grid button.feature { grid-column: 1 / -1; background: linear-gradient(120deg, color-mix(in srgb, var(--accent-2) 18%, var(--surface)), var(--surface)); border-color: color-mix(in srgb, var(--accent-2) 40%, var(--line)); }
.table-wrap { overflow-x: auto; }

th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: linear-gradient(120deg, var(--accent-2), var(--accent)); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.tool { align-self: flex-start; font-size: 12.5px; color: var(--muted); background: transparent; padding: 0 4px; }
.composer { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 8px; }
.composer textarea { min-height: 48px; max-height: 140px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px dashed var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.skeleton { height: 96px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sk 1.4s infinite linear; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* guide */
.steps-n { counter-reset: st; display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.steps-n > li { counter-increment: st; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.steps-n > li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--f-display); background: var(--accent-soft); color: var(--accent-2); }
.steps-n > li > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
pre.prompt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 12.5px/1.5 var(--f-data); max-height: 260px; overflow: auto; }
.status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.status-grid > div { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; min-width: 0; }
@media (max-width: 420px) { .status-grid { grid-template-columns: 1fr; } }

/* ===== Upgrade: zones, motion, aurora, gestures, data visuals ===== */
:root { --z1: #64748b; --z2: #22d3ee; --z3: #34d399; --zss: #a3e635; --z4: #fbbf24; --z5: #ff5a45; --aurora-o: .55; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --z1: #94a3b8; --z2: #0891b2; --z3: #059669; --zss: #65a30d; --z4: #d97706; --z5: #e5402c; --aurora-o: .35; } }
:root[data-theme="light"] { --z1: #94a3b8; --z2: #0891b2; --z3: #059669; --zss: #65a30d; --z4: #d97706; --z5: #e5402c; --aurora-o: .35; }

/* living background */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--aurora-o); }
.aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .22; will-change: transform; }
.aurora i:nth-child(1) { background: var(--swim); top: -30vmax; left: -25vmax; animation: drift1 38s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { background: var(--bike); top: 25vh; right: -35vmax; opacity: .14; animation: drift2 46s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { background: var(--run); bottom: -40vmax; left: 10vw; opacity: .16; animation: drift3 52s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18vw, 12vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vw, -10vh) scale(.9); } }
@keyframes drift3 { to { transform: translate(12vw, -14vh) scale(1.1); } }
.app, .tabs { position: relative; z-index: 1; }
.tabs { position: fixed; }
.card { position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, .045), transparent 45%), linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, transparent), color-mix(in srgb, var(--surface) 82%, transparent)); }

/* entrance + count-up */
main.animate > * { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
main.animate .arc { animation: ringfill 1.1s cubic-bezier(.2, .8, .2, 1) both .15s; }
@keyframes ringfill { from { stroke-dashoffset: var(--from); } }
main.animate .chart .draw { stroke-dasharray: 1; animation: drawline 1.2s ease-out both .1s; }
@keyframes drawline { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
main.animate .gauge .arc-fill { stroke-dasharray: 200; animation: gaugefill 1s cubic-bezier(.2, .8, .2, 1) both .15s; }
@keyframes gaugefill { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }

/* tab indicator + icon button */
.tabs-in { position: relative; }
.tab-ind { position: absolute; left: 4px; top: 4px; bottom: 4px; width: 0; border-radius: 16px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent-2) 30%, transparent); transition: transform .35s cubic-bezier(.3, .9, .3, 1.15), width .3s; pointer-events: none; opacity: 0; }
.tab { z-index: 1; }
.tab[aria-current="page"] { background: transparent; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

/* readiness gauge */
.gauge { width: 120px; height: 74px; flex: none; }
.readiness { align-items: center; }
.readiness > .stack { min-width: 150px; }
@media (max-width: 440px) { .readiness > .btn { width: 100%; } }

/* zone bar */
.zonebar { display: flex; gap: 2px; height: 10px; border-radius: 6px; overflow: hidden; }
.zonebar i { display: block; min-width: 2px; }
.z1 { background: var(--z1); } .z2 { background: var(--z2); } .z3 { background: var(--z3); } .zss { background: var(--zss); } .z4 { background: var(--z4); } .z5 { background: var(--z5); }
.zone-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: -2px; }
.zone-legend span { display: inline-flex; align-items: center; gap: 4px; }
.zone-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* swipe */
.sess[data-swipe] { touch-action: pan-y; transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .2s; user-select: none; -webkit-user-select: none; }
.sess.swiping { transition: none; }
.swipe-hint { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font: 800 20px var(--f-display); text-transform: uppercase; letter-spacing: .04em; pointer-events: none; opacity: 0; z-index: 3; }
.swipe-hint .sh-done { color: var(--good); opacity: 0; } .swipe-hint .sh-skip { color: var(--bad); opacity: 0; }
.sess[data-dir="right"] .swipe-hint, .sess[data-dir="left"] .swipe-hint { opacity: 1; }
.sess[data-dir="right"] .sh-done { opacity: var(--pull, 0); } .sess[data-dir="left"] .sh-skip { opacity: var(--pull, 0); }
.sess[data-dir="right"] { box-shadow: var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--good) calc(var(--pull, 0) * 100%), transparent); }
.sess[data-dir="left"] { box-shadow: var(--shadow), inset 0 0 0 2px color-mix(in srgb, var(--bad) calc(var(--pull, 0) * 100%), transparent); }
.swipe-tip { font-size: 11.5px; }
@media (hover: hover) and (pointer: fine) { .swipe-tip { display: none; } }

/* drag in plan */
.drag-ghost { opacity: .35; }
.drag-chosen { transform: scale(1.03); box-shadow: 0 12px 30px -10px var(--sc); }
body.dragging .day-list { min-height: 46px; border-radius: 12px; outline: 1px dashed color-mix(in srgb, var(--accent-2) 45%, transparent); outline-offset: 2px; }

/* chart tooltip */
.chart-wrap { position: relative; }
.chart { touch-action: pan-y; }
.chart-tip { position: absolute; top: 4px; z-index: 4; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 12px; min-width: 120px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; box-shadow: var(--shadow); }
.chart-tip.on { opacity: 1; transform: none; }
.chart-tip p { font-weight: 700; margin-bottom: 3px; }
.chart-tip div { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.chart-tip div i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chart-tip div b { margin-left: auto; padding-left: 10px; font-family: var(--f-data); }
.chart-guide { position: absolute; top: 0; width: 1px; background: var(--muted); opacity: 0; pointer-events: none; }
.chart-guide.on { opacity: .5; }

/* micro-interactions */
.srow, .menu-grid button, .goal-cards button, .tab { transition: transform .15s, border-color .15s, background .15s; }
.srow:active, .menu-grid button:active, .goal-cards button:active { transform: scale(.98); }
.sess:hover:not(.swiping) { border-color: color-mix(in srgb, var(--sc) 55%, var(--line)); }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 70; }
.bigcount .n { text-shadow: none; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent-2) 35%, transparent)); }

@media (prefers-reduced-motion: reduce) {
  .aurora i { animation: none; }
  main.animate > *, main.animate .arc, main.animate .chart .draw, main.animate .gauge .arc-fill { animation: none; }
  .tab-ind, .sess[data-swipe] { transition: none; }
}

/* animated sport scene */
:root { --scene-o: .2; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --scene-o: .13; } }
:root[data-theme="light"] { --scene-o: .13; }
#bg-scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: var(--scene-o); }
.hero-stage { position: relative; height: 190px; margin: -18px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; overflow: hidden; border-bottom: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%), var(--bg); z-index: 1; }
.hero-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage-fade { position: absolute; inset: auto 0 0; height: 40px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
@media (min-width: 700px) { .hero-stage { height: 230px; border-radius: 0 0 24px 24px; margin-inline: 0; border: 1px solid var(--line); border-top: 0; } }


/* ===== Lime unification overrides ===== */
.num, .mono, .stat .v, td.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-weight: 800; letter-spacing: .16em; }

.btn.primary:hover { filter: brightness(1.06); }
.btn.go { color: #0a0a0a; text-transform: uppercase; letter-spacing: .04em; font-weight: 800; }
.btn.ghost { color: var(--accent-2); }
.btn.outline { background: transparent; border: 1.5px solid var(--ink); text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }

.tab[aria-current="page"] svg { color: var(--accent-2); filter: none; }
.tab-ind { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lime) 40%, transparent); }
.day.today .day-l b { color: var(--accent-2); text-shadow: none; }
.wd.today b { color: var(--accent-2); }
.brand .v { color: var(--accent-2); }
:root:not([data-theme="light"]) .brand .v { color: var(--lime); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .brand .v, :root:not([data-theme="dark"]) .grad-text { color: var(--accent-2); } }
.bigcount .n { filter: none; color: var(--lime); }
.aurora i:nth-child(1) { background: var(--lime); opacity: .12; } .aurora i:nth-child(2) { background: #ffffff; opacity: .04; } .aurora i:nth-child(3) { background: var(--lime); opacity: .06; }
.card { border-radius: var(--r); }
.sicon { border-radius: 10px; }

/* ===== Media heroes (home + sport pages) ===== */
.hero-media { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-top: -18px; min-height: min(78vh, 600px); display: flex; align-items: flex-end; overflow: hidden; background: #0a0a0a radial-gradient(600px 300px at 70% 30%, rgba(198, 244, 50, .18), transparent 70%); color: #f4f4f0; }

.hero-media > video, .hero-media > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
.hero-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 10, 10, .15) 0%, rgba(10, 10, 10, .25) 40%, rgba(10, 10, 10, .92) 100%), linear-gradient(90deg, rgba(10, 10, 10, .65), transparent 70%); pointer-events: none; }
.hero-in { position: relative; z-index: 1; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 22px; display: flex; flex-direction: column; gap: 12px; width: 100%; }
.hero-in .eyebrow { color: #e5e5df; }
.hero-in h1 { font-size: clamp(42px, 11vw, 78px); color: #f4f4f0; line-height: .92; }
.hero-in h1 em { font-style: normal; color: var(--lime); }
.hero-in p { color: #d6d6cf; max-width: 46ch; }
.hero-stats { display: flex; gap: 18px; flex-wrap: wrap; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font: 900 34px/1 var(--f-display); font-stretch: 108%; color: var(--lime); }
.hero-stats span { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: #c9c9c2; font-weight: 700; }
.hero-in .btn.outline { color: #f4f4f0; border-color: #f4f4f0; }
.hero-feats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #d6d6cf; font-weight: 600; }
.hero-feats span { display: inline-flex; align-items: center; gap: 6px; }
.hero-feats span::before { content: ""; width: 7px; height: 7px; background: var(--lime); transform: rotate(45deg); }

/* ribbon */
.ribbon { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: var(--lime); color: #0a0a0a; overflow: hidden; transform: rotate(-1.5deg); margin-top: -8px; padding-block: 9px; box-shadow: 0 10px 30px -12px rgba(198, 244, 50, .5); }
.ribbon-track { display: flex; width: max-content; animation: marquee 26s linear infinite; }
.ribbon-track span { font: 900 17px/1 var(--f-display); font-stretch: 112%; letter-spacing: .1em; text-transform: uppercase; padding-right: 22px; white-space: nowrap; }
.ribbon-track span::after { content: "✦"; margin-left: 22px; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* sport tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #111 radial-gradient(240px 160px at 30% 20%, color-mix(in srgb, var(--sc) 35%, transparent), transparent 70%); cursor: pointer; padding: 0; text-align: left; color: #f4f4f0; max-width: 100%; }
.tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.tile:hover img, .tile:hover video { transform: scale(1.06); }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(10, 10, 10, .9)); }
.tile .tl { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; display: flex; flex-direction: column; gap: 3px; }
.tile .tl b { font: 900 26px/1 var(--f-display); font-stretch: 110%; text-transform: uppercase; }

/* ---------- intensity profile of a session (zone bar) ---------- */
function zoneProfile(s) {

  const t = s.type; const rep = (n, hard, z, ez) => { const a = []; for (let i = 0; i < n; i++) { a.push([z, hard]); if (i < n - 1) a.push([ez || 1, hard * 0.5]); } return a; };

    technique: [[1, 0.2], [2, 0.5], [1, 0.3]], openwater: [[1, 0.15], [3, 0.75], [1, 0.1]],
    css: [[1, 0.2]].concat(rep(6, 0.08, 4)).concat([[1, 0.12]]), speed: [[1, 0.2]].concat(rep(6, 0.05, 5)).concat([[3, 0.2], [1, 0.1]]),
    tempo: [[1, 0.2]].concat(rep(3, 0.17, 4)).concat([[1, 0.12]]), threshold: [[1, 0.2]].concat(rep(3, 0.15, 4)).concat([[1, 0.15]]),
    sweetspot: [[1, 0.2]].concat(rep(3, 0.16, 'ss')).concat([[1, 0.12]]), vo2: [[1, 0.22]].concat(rep(5, 0.07, 5)).concat([[1, 0.12]]),
    intervals: [[1, 0.22]].concat(rep(5, 0.08, 5)).concat([[1, 0.1]]), hills: [[1, 0.2]].concat(rep(6, 0.06, 4)).concat([[1, 0.16]]),
    racepace: [[1, 0.25], [3, 0.65], [1, 0.1]], brick: [[2, 0.45], [3, 0.35], [3, 0.2]], openers: [[1, 0.4], [4, 0.05], [1, 0.1], [4, 0.05], [1, 0.1], [4, 0.05], [1, 0.25]],
    test: [[1, 0.3], [5, 0.15], [1, 0.15], [5, 0.25], [1, 0.15]],
  };
  const prof = P[t] || P.endurance; const tot = prof.reduce((a, x) => a + x[1], 0);

}
function zoneBar(s) {

/* ---------- readiness gauge (semicircle) ---------- */
function gauge(score) {
  const R = 46, cx = 60, cy = 58; const pt = (v) => { const a = Math.PI * (1 - v / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const arc = (a, b, col, w, cls) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return '<path' + (cls ? ' class="' + cls + '"' : '') + ' d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' A' + R + ' ' + R + ' 0 0 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; };
  let g = '<svg class="gauge" viewBox="0 0 120 74" aria-hidden="true">' + arc(0.5, 39.5, 'var(--bad)', 9) + arc(40.5, 59.5, 'var(--warn)', 9) + arc(60.5, 99.5, 'var(--good)', 9);

    const [nx, ny] = pt(score); g += '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="6.5" fill="var(--surface)" stroke="' + tone + '" stroke-width="3"/>';
  }
  g += '<text x="60" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Archivo, sans-serif">' + (score == null ? '–' : '<tspan data-count="' + score + '">' + score + '</tspan>') + '</text></svg>';

}

/* ---------- swipe a session card: right = done, left = skip ---------- */
(function swipe() {

    if ('IntersectionObserver' in window && opts && opts.compact) new IntersectionObserver((en) => { sc.visible = en[0].isIntersecting; }).observe(canvas);
    if (!colors) readColors();
    if (still()) sc.draw(0); else kick();
    return sc;
  }
  function refresh() {
    for (let i = scenes.length - 1; i >= 0; i--) if (!scenes[i].canvas.isConnected) scenes.splice(i, 1);
    const bg = document.getElementById('bg-scene');
    if (bg) { bg.hidden = !enabled(); if (enabled()) attach(bg, { alpha: 1, trails: true }); }
    $$('canvas.hero-scene').forEach((c) => attach(c, { alpha: 1, trails: true, compact: true }));
    readColors();
    if (still()) staticFrame(); else kick();
  }
  window.addEventListener('resize', () => { scenes.forEach((s) => s.resize()); if (still()) staticFrame(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  return { refresh, enabled, setEnabled, readColors: () => readColors() };
})();

function currentPlanWeek() {

  return weeks[E.clamp(ci + UI.weekOffset, 0, weeks.length - 1)];
}
async function cleanupEvents(before, after) { // delete events for sessions that were cut; update changed ones
  const p = activeProfile();
  for (const a of after) {
    const b = before.find((x) => x.id === a.id); if (!b || !b.eventId) continue;
    if (a.status === 'cut') { calDelete(b.eventId).catch(() => {}); a.eventId = null; }
    else if (a.time && (a.title !== b.title || a.dur !== b.dur)) calBook(a, p).catch(() => {});

}

/* ---------- calendar flows ---------- */
async function bookOne(sid) {
  const f = findSession(sid); const p = activeProfile(); if (!f) return;
  if (!S.caps.mcp) { toast(S.inClaude ? 'Time saved. Calendar booking is not available in this view.' : 'Time saved. Add it to your calendar with Plan › Calendar file (.ics).'); return; }
  try { const id = await calBook(f.s, p); await updateSession(sid, { eventId: id || f.s.eventId || 'booked', allDayEvent: false }); toast('Booked ' + E.fmtDate(f.s.date) + ' ' + f.s.time + ' · reminder 1 h before'); }
  catch (e) { toast(calErr(e)); }
  scheduleRender();
}
async function suggestTimes(wid) {
  const w = S.weeks.find((x) => x.id === wid); const p = activeProfile(); if (!w) return;
  const t = today(); const end = E.addDays(w.weekStart, 6);
  let busy = {}, used = false;
  if (S.caps.mcp) { try { busy = await calBusy(w.weekStart < t ? t : w.weekStart, end); used = true; } catch (e) { toast(calErr(e)); } }
  const sessions = w.sessions.map((s) => Object.assign({}, s));
  const byDay = {};
  sessions.forEach((s) => { if (s.time) (byDay[s.date] = byDay[s.date] || []).push({ start: s.time, end: addMinutes(s.date, s.time, s.dur || 45).slice(11, 16) }); });
  let n = 0;
  sessions.filter((s) => s.status === 'planned' && !s.time && s.date >= t && s.sport !== 'race').sort((a, b) => b.dur - a.dur).forEach((s) => {
    const b = (busy[s.date] || []).concat(byDay[s.date] || []);
    const slot = E.suggestSlot(b, s.dur || 45, p.prefTime, s.date);
    if (slot) { s.suggest = slot; n++; (byDay[s.date] = byDay[s.date] || []).push({ start: slot, end: addMinutes(s.date, slot, s.dur || 45).slice(11, 16) }); }
  });
  await saveWeek(Object.assign({}, w, { sessions }));
  toast(n ? n + ' time(s) suggested' + (used ? ' around your calendar' : '') + '. Review, then Accept.' : 'No unscheduled sessions left this week');
}
async function acceptSuggest(wid) {
  const w = S.weeks.find((x) => x.id === wid); if (!w) return;
  const sessions = w.sessions.map((s) => (s.suggest && !s.time && s.status === 'planned' ? Object.assign({}, s, { time: s.suggest, suggest: null }) : s));
  await saveWeek(Object.assign({}, w, { sessions }));
  if (S.caps.mcp) await bookWeek(wid); else toast('Times set. Download the calendar file (.ics) to add them with 1-hour alarms.');
}
async function bookWeek(wid) {
  const w = S.weeks.find((x) => x.id === wid); const p = activeProfile(); if (!w) return;
  if (!S.caps.mcp) { toast('Calendar booking works when the app is opened inside Claude.'); return; }
  const t = today(); const todo = w.sessions.filter((s) => s.status === 'planned' && s.time && (!s.eventId || s.allDayEvent) && s.date >= t);
  if (!todo.length) { toast(w.sessions.some((s) => s.status === 'planned' && !s.time && s.date >= t) ? 'Set or accept times first, then book.' : 'All timed sessions are already booked'); return; }
  toast('Booking ' + todo.length + ' session(s)…');
  const ids = {}; let fail = null;
  for (const s of todo) { try { ids[s.id] = (await calBook(s, p)) || 'booked'; } catch (e) { fail = e; break; } }
  const cur = S.weeks.find((x) => x.id === wid);
  await saveWeek(Object.assign({}, cur, { sessions: cur.sessions.map((s) => (ids[s.id] ? Object.assign({}, s, { eventId: ids[s.id], allDayEvent: false }) : s)) }));
  toast(fail ? 'Booked ' + Object.keys(ids).length + '. ' + calErr(fail) : 'Booked ' + Object.keys(ids).length + ' session(s) with 1-hour reminders');
  scheduleRender();
}

function openSession(sid, focusTime) {

function shrinkImage(file, max) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

function icsFor(sessions) {
  const p = activeProfile(); const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';

  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Trivo//Training plan//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  sessions.forEach((s) => {
    const d = s.date.replace(/-/g, '');

    if (s.time) {
      const end = addMinutes(s.date, s.time, Math.max(15, s.dur || 60));
      L.push('DTSTART:' + d + 'T' + s.time.replace(':', '') + '00', 'DTEND:' + end.slice(0, 10).replace(/-/g, '') + 'T' + end.slice(11, 16).replace(':', '') + '00');
    } else L.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + E.addDays(s.date, 1).replace(/-/g, ''));

    L.push('DESCRIPTION:' + escI((s.steps || []).join('\n') + '\nFuel: ' + E.sessionFuel(s, p && p.sweatRate)));
    if (s.time) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + escI(s.title), 'TRIGGER:-PT60M', 'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

  offerFile('Trivo-icon.mobileconfig', new Blob([xml], { type: 'application/x-apple-aspen-config' }), 'application/x-apple-aspen-config');
}
async function buildLauncherZip() {
  const url = launchUrl(); if (!url) return; await saveLaunchUrl(url);
  if (typeof JSZip === 'undefined') { toast('The zip library did not load. Check your connection and try again.'); return; }

    '<div style="width:112px;height:112px;margin:0 auto">' + BADGE_SVG + '</div><h1 style="margin:12px 0 4px">' + APP + '</h1><p id="m">Opening your coach…</p><p><a id="go" href="' + xmlEsc(url) + '">Open ' + APP + '</a></p>' +
    '<p class="s" id="hint">Install this page to get the ' + APP + ' icon: Android Chrome › ⋮ › Install app · iPhone Safari › Share › Add to Home Screen · Chrome/Edge desktop › install icon in the address bar.</p></div>' +
    '<' + SC + '>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});var app=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;' +
    'if(app){document.getElementById("hint").style.display="none";setTimeout(function(){location.href=' + U + ';},250);}else{document.getElementById("m").textContent="Launcher for your ' + APP + ' app";}</' + SC + '></body></html>';
  const z = new JSZip();
  z.file('index.html', html);
  z.file('manifest.webmanifest', JSON.stringify({ name: APP_ICON, short_name: APP_ICON, start_url: './', scope: './', display: 'standalone', background_color: '#0a0a0a', theme_color: '#0a0a0a', icons: [{ src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] }, null, 1));
  z.file('sw.js', "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});");
  const ic = await iconsOrFail([180, 192, 512]); if (!ic) return;
  z.file('icon-192.png', ic[192]); z.file('icon-512.png', ic[512]); z.file('icon-180.png', ic[180]);

async function iconFile() { const png = await iconPng(512); if (png) offerFile('trivo-icon.png', png, 'image/png'); }

/* ---------- boot ---------- */
(function boot() {
  applyTheme(getTheme());
  try { S.chat = JSON.parse(localStorage.getItem('tricoach:chat') || '[]'); } catch (e) { S.chat = []; }
  window.addEventListener('hashchange', route);
  route(); render();
  initCaps().then(() => { startSync(); scheduleRender(); }).catch((e) => { console.error(e); S.mode = 'local'; startSync(); scheduleRender(); });
})();


/* ---------- season: races inside a main goal ---------- */
const SG_MODES = ['run', 'tri', 'bike', 'swim', 'duathlon', 'aquathlon'];
function sgLabel(sg) { return sg.name || E.goalSpec(sg).label; }
// another dated goal whose plan this goal's date falls inside (or that falls inside this one)
function overlapHost(goal) {
  if (!goal || !goal.date) return null;
  return S.profiles.filter((x) => x.goal && x.goal.date && x.goal.date >= today()).sort((a, b) => a.goal.date.localeCompare(b.goal.date)).find((x) => x.goal.date !== goal.date) || null;
}
function openOverlap(host) {
  const d = UI.pendingGoal; const newer = d.goal.date > host.goal.date;
  const main = newer ? (d.goal.name || E.goalSpec(d.goal).label) : goalLabel(host), sub = newer ? goalLabel(host) : (d.goal.name || E.goalSpec(d.goal).label);
  openSheet('These goals overlap', '<div class="note warn small stack" style="gap:6px"><b>⚠ ' + esc(sub) + ' (' + E.fmtDate(newer ? host.goal.date : d.goal.date, true) + ') falls inside your plan for ' + esc(main) + ' (' + E.fmtDate(newer ? d.goal.date : host.goal.date, true) + ').</b><span>Two separate plans cannot both be followed — you would train twice or miss sessions in one of them.</span></div>' +
    '<div class="panel stack small" style="gap:6px"><b>Recommended: one season</b><span><b>' + esc(main) + '</b> stays the main goal and sets the phases and taper. <b>' + esc(sub) + '</b> becomes a race inside it with its own mini-taper (deload) before it, race day, recovery after it, and race-specific sessions in the weeks before.</span><span>Every workout counts for both races.</span></div>' +
    '<div class="btn-row end"><button class="btn" data-act="ov-separate">Keep separate goals</button><button class="btn primary" data-act="ov-inside">Make it one season</button></div>');
}
async function overlapInside() {
  const d = UI.pendingGoal; closeSheet(); const host = overlapHost(d.goal); if (!host) return;
  if (d.goal.date < host.goal.date) { // new race goes inside the existing goal
    const m = Object.assign({}, S.meta, { id: 'app', activeProfileId: host.id }); S.meta = m; await saveDoc('meta', m);
    await setSubs(host, (host.subGoals || []).concat([subFromGoal(d.goal)]));
    go('goals'); toast('Added to your season. Mini-taper and recovery are in your plan.');
  } else { // new goal is the main race: create it, move the old goal inside
    const p = Object.assign({}, d, { id: uid('p'), created: new Date().toISOString(), subGoals: (host.subGoals || []).concat([subFromGoal(host.goal)]) });
    replaceLocal('profiles', p); await saveDoc('profiles', p);
    await dropProfile(host);
    const m = Object.assign({}, S.meta, { id: 'app', activeProfileId: p.id }); S.meta = m; await saveDoc('meta', m);
    toast('Building your season…'); await writeWeeks(p, E.generatePlan(p, { from: E.planStart(today()) }));
    go('goals'); toast('Season ready: ' + esc(goalLabel(p)) + ' with ' + p.subGoals.length + ' race(s) inside');
  }
}
function subFromGoal(g) { return { id: uid('sg'), name: g.name || '', mode: g.mode, preset: g.preset, dist: Object.assign({}, g.dist || {}), cross: g.cross, date: g.date }; }
async function dropProfile(p) {
  profileWeeks(p).forEach((w) => w.sessions.forEach((s) => { if (s.eventId && s.date >= today() && s.status !== 'done') calDelete(s.eventId).catch(() => {}); }));
  for (const w of profileWeeks(p)) { S.weeks = S.weeks.filter((x) => x.id !== w.id); await delDoc('weeks', w.id); }
  S.profiles = S.profiles.filter((x) => x.id !== p.id); await delDoc('profiles', p.id);
}
function openMerge(aId, bId) {
  const A = S.profiles.find((x) => x.id === aId), B = S.profiles.find((x) => x.id === bId); if (!A || !B) return;
  const [main, sub] = A.goal.date > B.goal.date ? [A, B] : [B, A];
  openSheet('Combine into one season', '<p class="small"><b>' + esc(goalLabel(main)) + '</b> (' + E.fmtDate(main.goal.date, true) + ') becomes the main goal. <b>' + esc(goalLabel(sub)) + '</b> (' + E.fmtDate(sub.goal.date, true) + ') moves inside it as a race with a mini-taper before and recovery after.</p><p class="small muted">The plan of ' + esc(goalLabel(main)) + ' is rebuilt from next Monday (session times on the same day and sport are kept). The separate plan of ' + esc(goalLabel(sub)) + ' is removed. Logged workouts stay.</p>' +
    '<div class="btn-row end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="ov-merge-go" data-main="' + esc(main.id) + '" data-sub="' + esc(sub.id) + '">Combine</button></div>');
}
async function mergeGoals(mainId, subId) {
  const main = S.profiles.find((x) => x.id === mainId), sub = S.profiles.find((x) => x.id === subId); closeSheet(); if (!main || !sub) return;
  const np = Object.assign({}, main, { subGoals: (main.subGoals || []).concat([subFromGoal(sub.goal)], sub.subGoals || []) });
  replaceLocal('profiles', np); await saveDoc('profiles', np);
  await dropProfile(sub);
  const m = Object.assign({}, S.meta, { id: 'app', activeProfileId: np.id }); S.meta = m; await saveDoc('meta', m);
  await reseason(np); toast('Combined: one season with ' + np.subGoals.length + ' race(s) inside');
}
// save sub-goals and reshape the plan: this week in place, next Monday onward rebuilt
async function setSubs(p, subs) {
  const np = Object.assign({}, p, { subGoals: subs }); replaceLocal('profiles', np); await saveDoc('profiles', np);
  await reseason(np); scheduleRender(); return np;
}
async function reseason(p) {
  const t = today(); const w = weekOf(p, t);
  if (w) {
    const ids = new Set((p.subGoals || []).map((x) => x.id));
    let ss = w.sessions.filter((s) => !(s.subRace && !ids.has(s.sub)) && !(s.subRace && s.date >= t));
    ss = ss.map((s) => (s.subOrig && s.status === 'planned' && s.date >= t ? Object.assign({}, s, s.subOrig, { subOrig: undefined, sharp: undefined }) : s));
    const nw = E.applySeason([Object.assign({}, w, { sessions: ss })], p, zonesOf(p), t)[0];
    await saveWeek(nw);
  }
  await regenerate(p, E.addDays(E.mondayOf(t), 7));
}
function openSub(sg) {
  const v = sg || { mode: 'run', preset: '10k', date: '', name: '' };
  const opts = SG_MODES.flatMap((m) => Object.entries(E.MODES[m].presets).map(([k, pr]) => [m + '|' + k, pr.label]));
  const p = activeProfile();
  openSheet(sg ? 'Edit season race' : 'Add a race to this season', '<div class="stack" style="gap:12px"><p class="small muted">Races inside <b>' + esc(goalLabel(p)) + '</b>' + (p.goal.date ? ' (' + E.fmtDate(p.goal.date, true) + ')' : '') + '. Each gets a mini-taper before it, race day, and recovery after it.</p>' +
    field('sg-name', 'Race name (optional)', inp('sg-name', v.name || '', 'text', 'placeholder="e.g. Cairo Runners 10K"')) +
    field('sg-type', 'Event', '<select id="sg-type">' + opts.map(([k, l]) => '<option value="' + k + '"' + (k === v.mode + '|' + v.preset ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>') +
    field('sg-date', 'Date', inp('sg-date', v.date || '', 'date')) +
    '<div class="btn-row end">' + (sg ? '<button class="btn ghost danger" data-act="sg-del" data-id="' + esc(sg.id) + '">Remove</button>' : '') + '<button class="btn primary" data-act="sg-save">' + (sg ? 'Save' : 'Add race') + '</button></div></div>', () => { UI.sgEdit = sg ? sg.id : null; });
}
async function saveSub() {
  const p = activeProfile(); const r = $('#sheet');
  const [mode, preset] = val(r, 'sg-type').split('|'); const date = val(r, 'sg-date'); const name = val(r, 'sg-name');
  if (!date) { toast('Pick the race date.'); return; }
  if (date < today()) { toast('That date is in the past.'); return; }
  if (p.goal.date && date >= p.goal.date) { toast('This race is on or after your main race. Create it as its own goal instead.'); return; }
  const list = (p.subGoals || []).filter((x) => x.id !== UI.sgEdit);
  list.push({ id: UI.sgEdit || uid('sg'), name, mode, preset, dist: {}, date });
  closeSheet(); toast('Updating your plan…');
  const np = await setSubs(p, list.sort((a, b) => a.date.localeCompare(b.date)));
  const warn = E.seasonWarnings(np, today()); toast(warn.length ? '⚠ ' + warn[0].text : 'Season updated: mini-taper and recovery added');
}

})();
