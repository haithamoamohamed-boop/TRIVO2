<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trivo</title><meta name="theme-color" content="#06080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trivo"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap"><style id="trivo-css">
/* Night Race — dark-first. Layout: centred 780px column, glass header, floating pill tab bar; sport colours glow like race lights. */
:root {
  --bg: #06080d; --surface: #0d121c; --surface-2: #141b28; --glass: rgba(13, 18, 28, .72); --line: #1f2a3b; --ink: #f1f5fb; --muted: #8b98ad;
  --accent: #4d8dff; --accent-2: #22d3ee; --accent-soft: rgba(77, 141, 255, .16); --on-accent: #04070c;
  --swim: #22d3ee; --bike: #fbbf24; --run: #ff5a45; --gym: #a78bfa; --race: #34d399; --rest: #64748b;
  --good: #34d399; --warn: #fbbf24; --bad: #ff5a45; --good-soft: rgba(52, 211, 153, .14); --warn-soft: rgba(251, 191, 36, .14); --bad-soft: rgba(255, 90, 69, .15);
  --glow-a: rgba(34, 211, 238, .10); --glow-b: rgba(255, 90, 69, .08);
  --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7);
  --f-display: "Saira Condensed", "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Saira", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px; --r-sm: 10px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f4f9; --surface: #ffffff; --surface-2: #eef1f7; --glass: rgba(255, 255, 255, .8); --line: #dce2ec; --ink: #0b1220; --muted: #586579;
  --accent: #2563eb; --accent-2: #0891b2; --accent-soft: rgba(37, 99, 235, .1); --on-accent: #ffffff;
  --swim: #0891b2; --bike: #d97706; --run: #e5402c; --gym: #7c3aed; --race: #059669; --rest: #64748b;
  --good: #059669; --warn: #b45309; --bad: #dc2626; --good-soft: rgba(5, 150, 105, .1); --warn-soft: rgba(217, 119, 6, .12); --bad-soft: rgba(220, 38, 38, .1);
  --glow-a: rgba(8, 145, 178, .07); --glow-b: rgba(229, 64, 44, .05); --shadow: 0 8px 24px -14px rgba(11, 18, 32, .35); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f4f9; --surface: #ffffff; --surface-2: #eef1f7; --glass: rgba(255, 255, 255, .8); --line: #dce2ec; --ink: #0b1220; --muted: #586579;
  --accent: #2563eb; --accent-2: #0891b2; --accent-soft: rgba(37, 99, 235, .1); --on-accent: #ffffff;
  --swim: #0891b2; --bike: #d97706; --run: #e5402c; --gym: #7c3aed; --race: #059669; --rest: #64748b;
  --good: #059669; --warn: #b45309; --bad: #dc2626; --good-soft: rgba(5, 150, 105, .1); --warn-soft: rgba(217, 119, 6, .12); --bad-soft: rgba(220, 38, 38, .1);
  --glow-a: rgba(8, 145, 178, .07); --glow-b: rgba(229, 64, 44, .05); --shadow: 0 8px 24px -14px rgba(11, 18, 32, .35); color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; min-height: 100vh;
  background: radial-gradient(900px 500px at -10% -10%, var(--glow-a), transparent 60%), radial-gradient(800px 600px at 110% 110%, var(--glow-b), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: .01em; line-height: 1.02; margin: 0; text-wrap: balance; text-transform: uppercase; }
h1 { font-size: 40px; } h2 { font-size: 26px; } h3 { font-size: 20px; }
p { margin: 0; }
a { color: var(--accent); }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 8px; }
.grad-text { background: linear-gradient(100deg, var(--swim), var(--bike) 50%, var(--run)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* shell */
.app { max-width: 780px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-row { display: flex; align-items: center; gap: 10px; }
.brand { font: 800 24px/1 var(--f-display); letter-spacing: .08em; display: flex; align-items: center; gap: 9px; text-transform: uppercase; }
.brand svg { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.top .spacer { flex: 1; }
.chip-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 46vw; }
.chip-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--rest); flex: none; }
.sync.ok { background: var(--good); box-shadow: 0 0 10px var(--good); } .sync.local { background: var(--warn); box-shadow: 0 0 10px var(--warn); } .sync.err { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: flex; flex-direction: column; gap: 20px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; pointer-events: none;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tabs-in { pointer-events: auto; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 4px; }
.tab { background: none; border: 0; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 16px; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.tab[aria-current="page"] svg { color: var(--accent-2); filter: drop-shadow(0 0 6px var(--accent-2)); }

/* lane line: swim / bike / run stripe */
.lane { height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--swim) 0 18px, var(--bike) 18px 36px, var(--run) 36px 54px, transparent 54px 60px); }

/* blocks */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card { background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 88%, var(--bg))); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .duo { grid-template-columns: 1fr; } }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; text-align: right; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; transition: transform .12s, border-color .12s, box-shadow .12s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(120deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 22px -8px var(--accent); }
.btn.go { background: var(--sc); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 20px -8px var(--sc); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-2); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row.end { justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

/* sport colouring */
.s-swim { --sc: var(--swim); } .s-bike { --sc: var(--bike); } .s-run { --sc: var(--run); } .s-gym { --sc: var(--gym); } .s-race { --sc: var(--race); } .s-other { --sc: var(--rest); }
.sicon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--sc); background: color-mix(in srgb, var(--sc) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sc) 35%, transparent), 0 0 18px -6px var(--sc); }
.sicon svg { width: 22px; height: 22px; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.hero h1 { font-size: 44px; }
.bigcount { text-align: right; }
.bigcount .n { font: 800 78px/0.85 var(--f-display); letter-spacing: -.01em; }
.bigcount .l { font: 700 11px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.rings-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.rings { width: 132px; height: 132px; flex: none; }
.ring-legend { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ring-legend div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.ring-legend b { font-family: var(--f-data); font-weight: 500; margin-left: auto; font-size: 13px; }
.ring-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 8px var(--sc); flex: none; }
@media (max-width: 380px) { .rings { width: 110px; height: 110px; } .bigcount .n { font-size: 62px; } .hero h1 { font-size: 36px; } }

/* session cards */
.sess { display: grid; grid-template-columns: auto 1fr; gap: 14px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--sc) 14%, var(--surface)), var(--surface) 55%);
  border-color: color-mix(in srgb, var(--sc) 35%, var(--line)); box-shadow: var(--shadow), 0 0 36px -22px var(--sc); }
.sess::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sc); box-shadow: 0 0 14px var(--sc); }
.sess-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sess-title { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.sess-title h3 { font-size: 24px; }
.sess-title .dur { font: 800 26px/1 var(--f-display); color: var(--sc); white-space: nowrap; }
.sess-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; }
.steps li::marker { color: var(--sc); font-weight: 700; }
.fuel { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.sess.is-done { opacity: .72; }
.sess.is-skipped, .sess.is-cut, .sess.is-missed, .sess.is-moved { opacity: .5; }
.sess.is-skipped h3, .sess.is-cut h3, .sess.is-moved h3 { text-decoration: line-through; }
.note { font-size: 13.5px; padding: 9px 11px; border-radius: 10px; background: var(--warn-soft); }
.note.info { background: var(--accent-soft); }

/* plan rows */
.day { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day-l { display: flex; flex-direction: column; }
.day-l b { font: 800 20px/1 var(--f-display); text-transform: uppercase; }
.day-l span { font-size: 12px; color: var(--muted); }
.day.today .day-l b { color: var(--accent-2); text-shadow: 0 0 12px var(--accent-2); }
.day-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.srow { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 10%, var(--surface-2)), var(--surface-2) 60%); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px 9px 0; cursor: pointer; text-align: left; width: 100%; }
.srow::before { content: ""; align-self: stretch; background: var(--sc); border-radius: 0 3px 3px 0; box-shadow: 0 0 10px var(--sc); }
.srow:hover { border-color: color-mix(in srgb, var(--sc) 50%, var(--line)); }
.srow .t { min-width: 0; }
.srow .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .t span { font-size: 12.5px; color: var(--muted); }
.srow .r { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12.5px; }
.srow .r > b { font: 700 16px/1 var(--f-display); color: var(--sc); }
.srow.is-done { opacity: .78; } .srow.is-skipped, .srow.is-cut, .srow.is-missed, .srow.is-moved { opacity: .45; }
.rest-day { font-size: 13px; color: var(--muted); padding: 6px 0; }

/* phase timeline */
.timeline { display: flex; gap: 3px; height: 26px; align-items: stretch; }
.timeline i { flex: 1; border-radius: 4px; min-width: 3px; cursor: pointer; border: 0; padding: 0; }
.timeline i.cur { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 14px var(--accent-2); }
.ph-base { background: color-mix(in srgb, var(--swim) 70%, transparent); }
.ph-build { background: color-mix(in srgb, var(--bike) 80%, transparent); }
.ph-peak { background: var(--run); }
.ph-taper, .ph-race { background: var(--race); }
.ph-deload, .ph-test { background: color-mix(in srgb, var(--rest) 55%, transparent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }

/* stats */
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font: 800 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .v small { font: 600 13px var(--f-body); color: var(--muted); margin-left: 3px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--swim), var(--bike), var(--run)); border-radius: 4px; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); padding: 6px 0; border-radius: 12px; }
.wd .dots { display: flex; gap: 3px; min-height: 9px; }
.wd .dots .dot { width: 8px; height: 8px; background: var(--sc); box-shadow: 0 0 6px var(--sc); }
.wd .dots .dot.open { background: transparent; border: 1.5px solid var(--sc); box-shadow: none; }
.wd.today { background: var(--accent-soft); }
.wd.today b { color: var(--accent-2); }
.wd b { font: 800 18px/1 var(--f-display); color: var(--ink); }

/* readiness */
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.s11 { grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 0; font-weight: 700; cursor: pointer; font-family: var(--f-data); }
.scale button[aria-pressed="true"] { background: linear-gradient(120deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); }
.scale-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.ring { width: 72px; height: 72px; flex: none; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="search"], input[type="url"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; padding: 9px 12px; min-height: 44px; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 0; border-color: transparent; }
input[type="file"] { max-width: 100%; }
.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.goal-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.goal-cards button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.goal-cards button b { font: 800 19px/1.05 var(--f-display); text-transform: uppercase; }
.goal-cards button span { font-size: 12px; color: var(--muted); }
.goal-cards button svg { width: 24px; height: 24px; color: var(--sc); }
.goal-cards button[aria-pressed="true"] { border-color: var(--sc, var(--accent)); box-shadow: inset 0 0 0 1px var(--sc, var(--accent)), 0 0 22px -10px var(--sc, var(--accent)); background: color-mix(in srgb, var(--sc, var(--accent)) 12%, var(--surface-2)); }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--accent-2); flex: none; }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(2, 4, 8, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; box-shadow: var(--shadow);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); max-height: 88vh; } }
.sheet-head { position: sticky; top: 0; background: var(--bg); padding: 16px 0 12px; display: flex; align-items: center; gap: 10px; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 24px; }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
.x { border: 1px solid var(--line); background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; }

.chart-wrap { overflow-x: auto; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

.chart-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .t { min-width: 0; }
.li .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }

.quick button { border: 1px dashed var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

      const metres = clamp(Math.round(dur * (z.css ? 60 / (z.css + 10) * 100 : 40) / 100) * 100, 800, 6000);
      switch (type) {
        case 'css': { const reps = n((metres - 800) / 120, 4, 20); return ['Warm-up 400 m easy + 4×50 build', reps + '×100 m @ CSS, 15 s rest — ' + T(4), 'Cool-down 200 m easy']; }
        case 'speed': { const reps = n((metres - 900) / 75, 6, 16); return ['Warm-up 400 m + 4×25 fast', reps + '×50 m fast, 20 s rest — ' + T(5), '4×100 m @ race pace, 15 s rest — ' + T(3), 'Cool-down 200 m']; }
        case 'openwater': return ['Warm-up 300 m easy', 'Continuous ' + clamp(metres - 500, 800, 5000) + ' m steady, sight every 6–8 strokes — ' + T(3), 'Practice 3 deep-water starts / buoy turns if open water', 'Cool-down 200 m'];
        case 'technique': return ['Warm-up 300 m', '8×50 m drills (catch-up, fingertip drag, 6-kick switch), 15 s rest', '6×100 m focus on long, relaxed stroke — ' + T(2), 'Remaining ' + Math.max(200, metres - 1300) + ' m pull buoy easy — ' + T(1)];
        case 'test': return ['Warm-up 600 m incl. 4×50 build', 'Easy 200 m', '400 m all-out time trial — record time', '10 min easy recovery swim', '200 m all-out time trial — record time', 'Cool-down 200 m. Log both times under Log › Record test'];
        case 'easy': return ['Continuous ' + clamp(metres, 800, 3000) + ' m very easy, mix strokes — ' + T(1)];

    if (sport === 'bike') {

        case 'sweetspot': { const rep = main >= 60 ? 15 : 10; const reps = n(main / (rep + 5), 2, 5); return ['Warm-up 15′ Z1–2', reps + '×' + rep + '′ sweet spot, 5′ easy between — ' + T('ss'), 'Cool-down 10′']; }
        case 'threshold': { const reps = n(main / 13, 2, 5); return ['Warm-up 15′ incl. 3×1′ high cadence', reps + '×8′ at threshold, 4′ easy — ' + T(4), 'Cool-down 10′']; }
        case 'vo2': { const reps = n(main / 6, 4, 8); return ['Warm-up 15′ incl. 2×30″ hard', reps + '×3′ hard, 3′ easy — ' + T(5), 'Cool-down 10′']; }

        case 'test': return ['Warm-up 20′ incl. 3×1′ hard', '5′ all-out, then 10′ easy', '20′ maximal steady effort — record avg power (or avg HR)', 'Cool-down 10′. FTP ≈ 95% of 20′ power'];
        case 'easy': return [fmtDur(dur) + ' easy spin, high cadence — ' + T(1)];
        default: return [fmtDur(dur) + ' steady endurance — ' + T(2), '3×5′ at ' + T(3) + ' in the second half'];

    if (sport === 'run') {

        case 'intervals': { const reps = n(main / 5, 4, 8); return ['Warm-up 15′ + 4 strides', reps + '×3′ hard, 2′ jog — ' + T(5), 'Cool-down 5′']; }
        case 'hills': { const reps = n(main / 3, 5, 10); return ['Warm-up 12′ easy', reps + '×60–90″ uphill strong, walk/jog down', 'Cool-down 8′ — ' + T(1)]; }

        case 'long': return [fmtDur(dur) + ' steady — ' + T(2), 'Flat route, walk breaks allowed in heat', 'Fuel if over 75′'];
        case 'easy': return [Math.max(15, dur - 5) + '′ easy — ' + T(2), '6×20″ relaxed strides at the end'];
        case 'recovery': return [dur + '′ very easy, conversational — ' + T(1)];
        case 'openers': return ['15′ easy', '4×30″ at race pace, 90″ jog', 'Easy to finish — ' + T(1)];
        case 'test': return ['Warm-up 15′ + 4 strides', '5 km time trial, even pacing, flat route — record time', 'Cool-down 10′'];

    return [];
  }

  /* ---------- gym ---------- */
  const GYM = {
    A: { title: 'Gym A · Lower body & posterior chain', ex: [
      { id: 'squat', name: 'Back squat or trap-bar deadlift', sets: 4, reps: 5, upper: false },
      { id: 'bss', name: 'Bulgarian split squat (per leg)', sets: 3, reps: 8, upper: false },
      { id: 'rdl', name: 'Romanian deadlift', sets: 3, reps: 8, upper: false },
      { id: 'calf', name: 'Single-leg calf raise, 3 s down', sets: 3, reps: 12, upper: false },
      { id: 'core1', name: 'Copenhagen plank + Pallof press', sets: 3, reps: '30 s / 10', upper: false, bw: true },
    ] },
    B: { title: 'Gym B · Upper body, swim-specific & core', ex: [

      { id: 'row', name: 'Single-arm dumbbell row', sets: 3, reps: 10, upper: true },
      { id: 'press', name: 'Push-ups or dumbbell bench press', sets: 3, reps: 10, upper: true },
      { id: 'facepull', name: 'Face pulls + band external rotation', sets: 3, reps: 15, upper: true },
      { id: 'stepup', name: 'Step-ups or hip thrust', sets: 3, reps: 8, upper: false },
      { id: 'core2', name: 'Dead bug + side plank', sets: 3, reps: '10 / 30 s', upper: false, bw: true },
    ] },
    T: { title: 'Travel circuit · Bodyweight', ex: [
      { id: 'tsquat', name: 'Split squat jumps or tempo squats', sets: 3, reps: 12, bw: true },
      { id: 'tpush', name: 'Push-ups', sets: 3, reps: 15, bw: true },
      { id: 'thinge', name: 'Single-leg RDL (bodyweight)', sets: 3, reps: 10, bw: true },
      { id: 'trow', name: 'Towel / band rows', sets: 3, reps: 15, bw: true },
      { id: 'tcore', name: 'Plank + side plank', sets: 3, reps: '45 s', bw: true },
    ] },
  };
  function gymScheme(phase) { // sets/reps adjust by phase
    if (phase === 'build') return { setsDelta: -1, note: 'Maintain loads, 1 set less. Stop 2 reps short of failure.' };
    if (phase === 'peak') return { setsDelta: -2, note: 'Light maintenance: 2 sets, same load, fast intent.' };
    if (phase === 'deload' || phase === 'test') return { setsDelta: -2, note: 'Deload: 2 sets at ~80% of usual load.' };
    return { setsDelta: 0, note: 'Heavy, low reps, never to failure. Add load when all sets feel ≤ RPE 8.' };
  }
  function nextLoad(history, ex) { // history: [{date, load, reps, sets, rpe}] newest first
    if (!history || !history.length) return null;
    const last = history[0];
    if (!last.load) return { load: null, note: 'Log a load to start progression' };
    const targetReps = typeof ex.reps === 'number' ? ex.reps : null;
    const hit = targetReps == null || (Number(last.reps) >= targetReps);
    const easy = !last.rpe || Number(last.rpe) <= 8;
    if (hit && easy) { const inc = ex.upper ? 1.25 : 2.5; return { load: Math.round((Number(last.load) + inc) * 4) / 4, note: '+' + inc + ' kg — last: ' + last.load + ' kg × ' + last.reps }; }

  }

  /* ---------- plan generation ---------- */
  function phaseLayout(profile, startMon) {
    const g = goalSpec(profile.goal);
    const raceDate = profile.goal && profile.goal.date;
    let n, taper = 0;
    if (raceDate && raceDate >= startMon) {
      n = clamp(Math.floor(diffDays(startMon, mondayOf(raceDate)) / 7) + 1, 1, 60);
      taper = Math.min(n, (g.taper || 1) + 1); // taper weeks incl. race week
    } else n = 12; // rolling block, regenerated later
    const out = [];
    const rest = n - taper;
    const peak = raceDate ? (rest >= 10 ? 2 : rest >= 6 ? 1 : 0) : 0;
    const build = Math.round((rest - peak) * (raceDate ? 0.45 : 0.5));
    const base = rest - peak - build;
    for (let i = 0; i < base; i++) out.push('base');
    for (let i = 0; i < build; i++) out.push('build');
    for (let i = 0; i < peak; i++) out.push('peak');
    for (let i = 0; i < taper; i++) out.push(i === taper - 1 && raceDate ? 'race' : 'taper');

  }
  // new plans start today early in the week, otherwise next Monday
  function planStart(t) { return dow(t) <= 2 ? t : addDays(mondayOf(t), 7); }
  function needsTest(profile) {
    const b = profile.baselines || {}; const sp = goalSpec(profile.goal).sports;
    const have = { swim: parseTime(b.swim400) && parseTime(b.swim200), run: parseTime(b.run5k), bike: Number(b.ftp) || Number(b.bikeLTHR) };
    return !sp.some((s) => have[s]);
  }

  function generatePlan(profile, opts) {
    opts = opts || {};
    const from = opts.from || todayStr();
    const startMon = mondayOf(from);
    const phases = phaseLayout(profile, startMon);
    const z = computeZones(profile.baselines);
    const g = goalSpec(profile.goal);
    const H = clamp(Number(profile.hours) || 8, 3, 25);
    const weeks = [];
    // block counter for 3:1 loading; tests every 6-8 weeks in a deload week
    let blockIdx = 0, sinceTest = profile.lastTestDate ? Math.floor(diffDays(profile.lastTestDate, startMon) / 7) : 99;
    const firstTest = opts.noTest ? false : needsTest(profile) || sinceTest >= 7;
    // ramp positions per phase
    const counts = {}; phases.forEach((p) => (counts[p] = (counts[p] || 0) + 1));
    const seen = {};
    for (let i = 0; i < phases.length; i++) {
      let phase = phases[i];
      const weekStart = addDays(startMon, i * 7);
      seen[phase] = (seen[phase] || 0) + 1;
      let deload = false, test = false;
      if (i === 0 && firstTest && (phase === 'base' || phase === 'build')) { test = true; sinceTest = 0; }
      else if (phase === 'base' || phase === 'build' || phase === 'peak') {
        blockIdx++;
        if (blockIdx % 4 === 0 && phase !== 'peak') { deload = true; if (sinceTest >= 6) { test = true; sinceTest = 0; } }
      }
      sinceTest++;
      const pos = counts[phase] > 1 ? (seen[phase] - 1) / (counts[phase] - 1) : 1;
      let factor = { base: 0.72 + 0.18 * pos, build: 0.9 + 0.1 * pos, peak: 1.0, taper: counts.taper > 1 ? 0.7 - 0.15 * pos : 0.6, race: 0.4 }[phase];
      if (deload) factor = 0.65;
      if (test) factor = Math.min(factor, 0.7);
      const kind = test ? 'test' : deload ? 'deload' : phase;
      const week = buildWeek(profile, { weekStart, phase, kind, factor, H, z, g, idx: i, total: phases.length });
      week.deload = deload; week.test = test;
      weeks.push(week);
    }
    // a plan started mid-week only schedules from the start date on
    if (weeks.length && from > startMon) {
      const w0 = weeks[0];
      w0.sessions = w0.sessions.filter((s) => s.date >= from);
      w0.targetMin = w0.sessions.reduce((a, s) => a + (s.sport === 'gym' || s.sport === 'race' ? 0 : s.dur), 0);
    }
    return weeks;
  }

  function sportSplit(profile, g) {
    const lv = profile.levels || {};
    const out = { swim: 0, bike: 0, run: 0 };
    if (g.single) {
      const sec = g.single === 'bike' ? 'run' : 'bike'; // easy aerobic cross-training
      const c = g.cross ? (g.single === 'bike' ? 0.15 : 0.2) : 0;
      out[g.single] = 1 - c; out[sec] = c; return out;
    }
    if (g.mode === 'duathlon') return { swim: 0, bike: 0.55, run: 0.45 };
    if (g.mode === 'aquathlon') return (lv.swim || 2) >= 3 ? { swim: 0.3, bike: 0, run: 0.7 } : { swim: 0.4, bike: 0, run: 0.6 };
    const all = g.sports.length === 3;
    if (!all) { g.sports.forEach((s) => (out[s] = 1 / g.sports.length)); return out; }
    let s = { swim: 0.2, bike: 0.48, run: 0.32 };
    if ((lv.swim || 2) >= 3) s = { swim: 0.15, bike: 0.51, run: 0.34 }; // strong swimmer: shift time to bike/run
    if ((lv.run || 2) <= 1) { s.run -= 0.04; s.bike += 0.04; } // protect new runners from impact load
    return s;
  }

  function buildWeek(profile, w) {
    const { weekStart, phase, kind, factor, H, z, g } = w;
    const totalMin = H * 60 * factor;
    const split = sportSplit(profile, g);
    const lib = PHASE_SESSIONS[kind] || PHASE_SESSIONS.base;
    const sessions = [];
    for (const sport of ['swim', 'bike', 'run']) {
      const min = totalMin * split[sport];
      if (min < 15) continue;
      const primary = g.sports.includes(sport);
      const cap = longCap(sport, g);
      let count = sport === 'swim' ? Math.round(min / 50) : sport === 'bike' ? Math.round(min / 70) : Math.round(min / 48);
      const maxC = g.single === sport ? 6 : sport === 'swim' ? 3 : 4;
      count = clamp(count, primary ? (g.single === sport ? 2 : 1) : 1, primary ? maxC : 2);
      let types = primary ? lib[sport].slice(0, count) : ['easy', 'endurance'].slice(0, count).map((t) => (LIB[sport][t] ? t : 'easy'));
      while (types.length < count) types.push(sport === 'run' ? 'easy' : 'endurance');
      if (!g.brick) types = types.map((t) => (t === 'brick' ? 'long' : t));
      if (!profile.openWater && sport === 'swim') types = types.map((t) => (t === 'openwater' ? 'endurance' : t));
      if (!primary) types = types.map((t) => (t === 'test' ? 'easy' : t));
      // no duplicated long session in a week
      let seenLong = false; types = types.map((t) => { if (LIB[sport][t] && LIB[sport][t].long) { if (seenLong) return sport === 'run' ? 'easy' : 'endurance'; seenLong = true; } return t; });
      const wsum = types.reduce((a, t) => a + (LIB[sport][t] || LIB[sport].endurance || LIB[sport].easy).w, 0);
      types.forEach((t) => {
        const L = LIB[sport][t] || LIB[sport].easy;
        let dur = r5(clamp(min * L.w / wsum, MIN_DUR[sport], Math.min(L.long ? cap : Math.max(MIN_DUR[sport], Math.round(cap * 0.8)), sport === 'swim' && g.single === 'swim' ? 120 : MAX_DUR[sport])));
        if (t === 'test') dur = sport === 'swim' ? 50 : sport === 'bike' ? 60 : 45;
        const ses = mkSession(sport, t, dur, z, { raceRunKm: g.dist.run });
        if (!primary) { ses.title += ' (cross-training)'; ses.key = false; }
        sessions.push(ses);
      });
    }
    // polarised cap: at most 2 hard bike/run sessions a week (later ones become easy)
    let hardCount = 0;
    sessions.forEach((s, k) => {
      if (s.sport === 'swim' || s.i < 2 || s.test) return;
      hardCount++;
      if (hardCount > 2) sessions[k] = mkSession(s.sport, s.sport === 'run' ? 'easy' : 'endurance', s.dur, z);
    });
    // gym
    const gymN = !profile.gym ? 0 : { base: 2, build: H >= 8 ? 2 : 1, peak: 1, taper: 0, race: 0, deload: 1, test: 0 }[kind] || 0;
    const scheme = gymScheme(kind);
    for (let i = 0; i < gymN; i++) sessions.push(mkGym(i === 0 ? 'A' : 'B', scheme, kind));
    if (kind === 'race' && profile.goal && profile.goal.date) {
      sessions.push({ sport: 'race', type: 'race', title: (profile.goal.name || g.label) + ' — RACE DAY', dur: 0, key: true, i: 2, tss: 0, steps: ['Follow the Race planner: pacing, fuel timeline and checklist', 'Arrive 90′ early, rack, warm up 10′ easy'], fixedDate: profile.goal.date });
    }
    const placed = placeSessions(sessions, profile, weekStart);
    const focus = { base: 'Aerobic base, technique and strength', build: g.brick ? 'Race-specific intensity and bricks' : 'Race-specific intensity', peak: 'Race simulation, sharpen', taper: 'Freshen up: volume down, keep some intensity', race: 'Race week: rest, openers, race', deload: 'Recovery week: absorb training', test: 'Test week: set your zones' }[kind];
    return { weekStart, phase, kind, idx: w.idx, total: w.total, factor: Math.round(factor * 100) / 100, targetMin: Math.round(placed.reduce((a, s) => a + (s.sport === 'gym' || s.sport === 'race' ? 0 : s.dur), 0)), focus, sessions: placed };
  }

  function mkSession(sport, type, dur, z, ctx) {
    const L = LIB[sport][type] || LIB[sport].easy;
    return { sport, type, title: L.title, dur, key: !!L.key, long: !!L.long, i: L.i, tss: Math.round((dur / 60) * L.IF * L.IF * 100), steps: steps(sport, type, dur, z, ctx), test: L.test || null };
  }
  function mkGym(which, scheme, kind) {
    const G = GYM[which];
    return { sport: 'gym', type: 'gym' + which, gym: which, title: G.title, dur: 45, key: false, i: 1, tss: 35, scheme: scheme.note,
      ex: G.ex.map((e) => ({ id: e.id, name: e.name, sets: Math.max(2, e.sets + scheme.setsDelta), reps: e.reps, upper: !!e.upper, bw: !!e.bw })),
      steps: ['Warm-up 8′: bike/row + mobility', ...G.ex.map((e) => e.name + ' — ' + Math.max(2, e.sets + scheme.setsDelta) + '×' + e.reps), scheme.note] , kind };
  }

  /* placement: assign dates; max 2 sessions/day; hard days not adjacent; long sessions on chosen days */
  function placeSessions(list, profile, weekStart) {
    const avail = (profile.days && profile.days.length ? profile.days : [0, 1, 2, 3, 4, 5, 6]).slice();
    const rest = profile.restDay != null && profile.restDay !== '' ? Number(profile.restDay) : null;
    let days = avail.filter((d) => d !== rest);
    if (!days.length) days = avail.length ? avail : [0, 1, 2, 3, 4, 5, 6];
    const LR = profile.longRideDay != null ? Number(profile.longRideDay) : 5;
    const LN = profile.longRunDay != null ? Number(profile.longRunDay) : 6;
    const load = {}; for (let d = 0; d < 7; d++) load[d] = { n: 0, min: 0, hard: false, sports: [], long: false };
    const out = [];
    const put = (s, d) => {
      const L = load[d]; L.n++; L.min += s.dur; if (s.i >= 2 || s.long) L.hard = true; if (s.long) L.long = true; L.sports.push(s.sport);
      out.push(Object.assign({}, s, { date: addDays(weekStart, d) }));
    };
    const nearest = (pref, used) => { // closest available day to pref
      const order = [pref, pref - 1, pref + 1, pref - 2, pref + 2, pref - 3, pref + 3].filter((d) => d >= 0 && d < 7);
      return order.find((d) => days.includes(d) && !used(d));
    };
    const fixed = list.filter((s) => s.fixedDate);
    fixed.forEach((s) => { const d = dow(s.fixedDate); put(s, d); });
    const longs = list.filter((s) => !s.fixedDate && s.long).sort((a, b) => b.dur - a.dur);
    const keys = list.filter((s) => !s.fixedDate && !s.long && s.key).sort((a, b) => b.i - a.i || b.dur - a.dur);
    const rest2 = list.filter((s) => !s.fixedDate && !s.long && !s.key && s.sport !== 'gym').sort((a, b) => b.dur - a.dur);
    const gyms = list.filter((s) => s.sport === 'gym');
    longs.forEach((s) => {
      const pref = s.sport === 'run' ? LN : LR;
      let d = nearest(pref, (x) => load[x].long || load[x].n >= 2);
      if (d == null) d = days.find((x) => load[x].n < 2);
      if (d == null) d = days[0];
      put(s, d);
    });
    const score = (s, d) => {
      const L = load[d]; if (!days.includes(d) || L.n >= 2) return -1e9;
      let sc = 100 - L.n * 40 - L.min / 6;
      if (L.sports.includes(s.sport)) sc -= 80;
      const prev = load[d - 1], next = load[d + 1];
      if (s.i >= 2) {
        // stacking a hard swim with another hard session keeps easy days easy; adjacent hard days are worse
        const swimPair = s.sport === 'swim' || L.sports.includes('swim');
        if (L.hard) sc -= swimPair && !L.long ? 15 : 60;
        if (prev && prev.hard) sc -= 45; if (next && next.hard) sc -= 45;
      }
      if (s.sport === 'run' && next && next.long && next.sports.includes('run')) sc -= 30; // keep legs fresh before long run
      if (s.sport === 'swim' && L.n === 1 && !L.sports.includes('swim')) sc += 15; // swims pair well
      if (L.long) sc -= 25;
      return sc;
    };
    const best = (s) => { let bd = null, bs = -1e10; for (let d = 0; d < 7; d++) { const sc = score(s, d); if (sc > bs) { bs = sc; bd = d; } } return bs > -1e8 ? bd : null; };
    keys.concat(rest2).forEach((s) => { const d = best(s); if (d != null) put(s, d); else out.push(Object.assign({}, s, { date: null, overflow: true })); });
    gyms.forEach((s) => {
      // gym on a hard (non-long) day, not the day before a long run, else lightest day
      let cand = days.filter((d) => load[d].n < 2 && load[d].hard && !load[d].long && !(d + 1 === LN));
      if (!cand.length) cand = days.filter((d) => load[d].n < 2 && !load[d].long && !load[d].sports.includes('gym'));
      if (!cand.length) cand = days.filter((d) => load[d].n < 2);
      cand = cand.filter((d) => !load[d].sports.includes('gym') && !(load[d - 1] && load[d - 1].sports.includes('gym')) && !(load[d + 1] && load[d + 1].sports.includes('gym')));
      if (cand.length) put(s, cand.sort((a, b) => load[a].min - load[b].min)[0]);
    });
    const placed = out.filter((s) => s.date).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (b.i - a.i)));
    // ids & state
    const perDay = {};
    return placed.map((s) => { perDay[s.date] = (perDay[s.date] || 0) + 1; return Object.assign(s, { id: s.date + '-' + perDay[s.date], status: 'planned', time: null, eventId: null }); });
  }

  /* ---------- readiness & adaptation ---------- */
  function readinessScore(r, z) {
    if (!r) return null;
    let s = 0;
    s += ((Number(r.sleepQ) || 3) - 1) / 4 * 25;
    const h = Number(r.sleepH) || 7; s += clamp((h - 4.5) / 3, 0, 1) * 20;
    s += (5 - (Number(r.soreness) || 2)) / 4 * 20;

function lineChart(o) {

  if (o.zero && lo < 0 && hi > 0) g += '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
  if (!o.spark) (o.xlabels || []).forEach(([i, t], k, arr) => { g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="' + (k === 0 ? 'start' : k === arr.length - 1 ? 'end' : 'middle') + '">' + esc(t) + '</text>'; });
  o.series.forEach((s) => {
    const pts = s.pts.filter((p) => p[1] != null && isFinite(p[1]));
    if (!pts.length) return;
    const d = pts.map((p, k) => (k ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    if (s.area) g += '<path d="' + d + ' L' + x(pts[pts.length - 1][0]) + ' ' + y(Math.max(lo, 0)) + ' L' + x(pts[0][0]) + ' ' + y(Math.max(lo, 0)) + ' Z" fill="' + s.color + '" opacity=".12"/>';
    g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.w || 3) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="4 4"' : '') + '/>';
    const last = pts[pts.length - 1]; g += '<circle cx="' + x(last[0]) + '" cy="' + y(last[1]) + '" r="5" fill="' + s.color + '"/>';
    if (s.dots) pts.forEach((p) => { g += '<circle cx="' + x(p[0]) + '" cy="' + y(p[1]) + '" r="4" fill="' + s.color + '"/>'; });
  });

  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'chart') + '">' + g + '</svg></div>' + leg;

  const keys = [['swim', 'var(--swim)'], ['bike', 'var(--bike)'], ['run', 'var(--run)'], ['gym', 'var(--gym)']];

    '<p><b>Zones.</b> Swim CSS = (400 m time − 200 m time) ÷ 2. Run threshold ≈ 5 km pace + 5%. Bike FTP ≈ 95% of a 20′ all-out average. HR zones follow Friel percentages of LTHR; without a test LTHR ≈ 89% of max HR (Tanaka: 208 − 0.7 × age). These are estimates until you test.</p>' +
    '<p><b>Load.</b> Training stress (TSS-style) from intensity factor² × hours × 100, using pace, power or HR versus threshold, else RPE. Fitness and fatigue are 42- and 7-day exponential averages (Banister / Coggan PMC model).</p>' +
    '<p><b>Check-in.</b> Sleep, soreness, stress, motivation, resting HR and pain make a 0–100 score. Below 60 a hard session becomes endurance; below 40 it is shortened; pain ≥ 4 swaps running for non-impact work; pain ≥ 6 means rest. Three days of pain flags a physiotherapist visit.</p>' +
    '<p><b>Not medical advice.</b> Get a pre-season medical check, and see a professional for pain that persists.</p></div></section>';
}

document.addEventListener('click', (e) => {

});
document.addEventListener('change', (e) => {
  const el = e.target;

document.addEventListener('submit', (e) => {

document.addEventListener('keydown', (e) => {

function currentPlanWeek() {
  const p = activeProfile(); const weeks = profileWeeks(p); const t = today();
  let ci = weeks.findIndex((w) => t >= w.weekStart && t <= E.addDays(w.weekStart, 6)); if (ci < 0) ci = t < (weeks[0] || {}).weekStart ? 0 : weeks.length - 1;
  return weeks[E.clamp(ci + UI.weekOffset, 0, weeks.length - 1)];
}
async function cleanupEvents(before, after) { // delete events for sessions that were cut; update changed ones
  const p = activeProfile();
  for (const a of after) {
    const b = before.find((x) => x.id === a.id); if (!b || !b.eventId) continue;
    if (a.status === 'cut') { calDelete(b.eventId).catch(() => {}); a.eventId = null; }
    else if (a.time && (a.title !== b.title || a.dur !== b.dur)) calBook(a, p).catch(() => {});
  }
}

/* ---------- calendar flows ---------- */
async function bookOne(sid) {
  const f = findSession(sid); const p = activeProfile(); if (!f) return;
  if (!S.caps.mcp) { toast(S.inClaude ? 'Time saved. Calendar booking is not available in this view.' : 'Time saved. Add it to your calendar with Plan › Calendar file (.ics).'); return; }
  try { const id = await calBook(f.s, p); await updateSession(sid, { eventId: id || f.s.eventId || 'booked', allDayEvent: false }); toast('Booked ' + E.fmtDate(f.s.date) + ' ' + f.s.time + ' · reminder 1 h before'); }
  catch (e) { toast(calErr(e)); }
  scheduleRender();
}
async function suggestTimes(wid) {
  const w = S.weeks.find((x) => x.id === wid); const p = activeProfile(); if (!w) return;
  const t = today(); const end = E.addDays(w.weekStart, 6);
  let busy = {}, used = false;
  if (S.caps.mcp) { try { busy = await calBusy(w.weekStart < t ? t : w.weekStart, end); used = true; } catch (e) { toast(calErr(e)); } }
  const sessions = w.sessions.map((s) => Object.assign({}, s));
  const byDay = {};
  sessions.forEach((s) => { if (s.time) (byDay[s.date] = byDay[s.date] || []).push({ start: s.time, end: addMinutes(s.date, s.time, s.dur || 45).slice(11, 16) }); });
  let n = 0;
  sessions.filter((s) => s.status === 'planned' && !s.time && s.date >= t && s.sport !== 'race').sort((a, b) => b.dur - a.dur).forEach((s) => {
    const b = (busy[s.date] || []).concat(byDay[s.date] || []);
    const slot = E.suggestSlot(b, s.dur || 45, p.prefTime, s.date);
    if (slot) { s.suggest = slot; n++; (byDay[s.date] = byDay[s.date] || []).push({ start: slot, end: addMinutes(s.date, slot, s.dur || 45).slice(11, 16) }); }
  });
  await saveWeek(Object.assign({}, w, { sessions }));
  toast(n ? n + ' time(s) suggested' + (used ? ' around your calendar' : '') + '. Review, then Accept.' : 'No unscheduled sessions left this week');
}
async function acceptSuggest(wid) {
  const w = S.weeks.find((x) => x.id === wid); if (!w) return;
  const sessions = w.sessions.map((s) => (s.suggest && !s.time && s.status === 'planned' ? Object.assign({}, s, { time: s.suggest, suggest: null }) : s));
  await saveWeek(Object.assign({}, w, { sessions }));
  if (S.caps.mcp) await bookWeek(wid); else toast('Times set. Download the calendar file (.ics) to add them with 1-hour alarms.');
}
async function bookWeek(wid) {
  const w = S.weeks.find((x) => x.id === wid); const p = activeProfile(); if (!w) return;
  if (!S.caps.mcp) { toast('Calendar booking works when the app is opened inside Claude.'); return; }
  const t = today(); const todo = w.sessions.filter((s) => s.status === 'planned' && s.time && (!s.eventId || s.allDayEvent) && s.date >= t);
  if (!todo.length) { toast(w.sessions.some((s) => s.status === 'planned' && !s.time && s.date >= t) ? 'Set or accept times first, then book.' : 'All timed sessions are already booked'); return; }
  toast('Booking ' + todo.length + ' session(s)…');
  const ids = {}; let fail = null;
  for (const s of todo) { try { ids[s.id] = (await calBook(s, p)) || 'booked'; } catch (e) { fail = e; break; } }
  const cur = S.weeks.find((x) => x.id === wid);
  await saveWeek(Object.assign({}, cur, { sessions: cur.sessions.map((s) => (ids[s.id] ? Object.assign({}, s, { eventId: ids[s.id], allDayEvent: false }) : s)) }));
  toast(fail ? 'Booked ' + Object.keys(ids).length + '. ' + calErr(fail) : 'Booked ' + Object.keys(ids).length + ' session(s) with 1-hour reminders');
  scheduleRender();
}

function openSession(sid, focusTime) {
  const f = findSession(sid); if (!f) return; const s = f.s; const p = activeProfile();
  const dates = []; for (let i = -1; i < 14; i++) { const d = E.addDays(E.mondayOf(s.date), i + 1); if (d >= today() && weekOf(p, d)) dates.push(d); }
  let h = '<div class="row s-' + esc(s.sport) + '">' + sicon(s.sport) + '<div class="stack" style="gap:3px;min-width:0;flex:1"><b>' + E.fmtDate(s.date, true) + (s.dur ? ' · ' + E.fmtDur(s.dur) : '') + '</b><div class="sess-meta">' + (s.key ? pill('Key', 'info') : '') + statusPill(s) + timePill(s) + '</div></div></div>' +
    (s.note ? '<div class="note info">' + esc(s.note) + '</div>' : '') + (s.weatherNote ? '<div class="note">' + esc(s.weatherNote) + '</div>' : '') +
    '<ol class="steps s-' + esc(s.sport) + '">' + (s.steps || []).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol>' + (s.ex ? gymTargets(s) : '') +
    (s.sport !== 'race' ? '<div class="fuel">' + esc(E.sessionFuel(s, p.sweatRate)) + '</div>' : '');
  if (s.status === 'planned') {

function shrinkImage(file, max) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* ---------- calendar file (.ics) ---------- */
function icsFor(sessions) {
  const p = activeProfile(); const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  const stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
  const escI = (t) => String(t || '').replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Trivo//Training plan//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  sessions.forEach((s) => {
    const d = s.date.replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:' + s.id + '@trivo', 'DTSTAMP:' + stamp);
    if (s.time) {
      const end = addMinutes(s.date, s.time, Math.max(15, s.dur || 60));
      L.push('DTSTART:' + d + 'T' + s.time.replace(':', '') + '00', 'DTEND:' + end.slice(0, 10).replace(/-/g, '') + 'T' + end.slice(11, 16).replace(':', '') + '00');
    } else L.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + E.addDays(s.date, 1).replace(/-/g, ''));
    L.push('SUMMARY:' + escI(SPORT[s.sport] + ' · ' + s.title + (s.dur ? ' · ' + E.fmtDur(s.dur) : '')));
    L.push('DESCRIPTION:' + escI((s.steps || []).join('\n') + '\nFuel: ' + E.sessionFuel(s, p && p.sweatRate)));
    if (s.time) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + escI(s.title), 'TRIGGER:-PT60M', 'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

// Draws the Tri-badge with canvas paths (no image loading, so it works in every sandbox)
function drawBadge(x, size) {
  x.save(); x.scale(size / 112, size / 112);
  x.fillStyle = '#06080d'; x.fillRect(0, 0, 112, 112);
  x.lineCap = 'round'; x.lineJoin = 'round';
  const st = (d, col, w) => { x.strokeStyle = col; x.lineWidth = w; x.stroke(new Path2D(d)); };
  const dot = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
  const ring = (cx, cy, r, col) => { x.strokeStyle = col; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke(); };
  st('M56 14a42 42 0 0 1 36.4 21', '#22d3ee', 5); st('M96.6 44a42 42 0 0 1-19.6 48.4', '#fbbf24', 5); st('M66 97a42 42 0 0 1-50.7-41', '#ff5a45', 5);
  dot(51, 31, 3.5, '#22d3ee'); st('M44 40c3-6 11-9 17-6', '#22d3ee', 3); st('M41 46c3-2 6 2 9 0s6 2 9 0 6 2 9 0', '#22d3ee', 3);
  ring(35, 73, 7, '#fbbf24'); ring(55, 73, 7, '#fbbf24'); st('M35 73l6-11h8l6 11M41 62l4 11h4M47 58h4', '#fbbf24', 3);
  dot(78, 55, 3.5, '#ff5a45'); st('M76 61l-3 10 6 4-2 8M73 71l-5 3M75 64l7 3 2-3', '#ff5a45', 3);
  x.restore();
}
function iconPng(size) {
  return new Promise((res) => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = size;
      drawBadge(c.getContext('2d'), size);
      c.toBlob((b) => res(b && b.size > 200 ? b : null), 'image/png');
    } catch (e) { res(null); }
  });
}
async function iconsOrFail(sizes) {
  const out = {};
  for (const s of sizes) { const b = await iconPng(s); if (!b) { toast('Could not draw the app icon on this device. Download the icon PNG instead.'); return null; } out[s] = b; }
  return out;
}
async function buildPwaZip() {

const SW_SOURCE = [
  "const C = 'trivo-v1';",
  "const CORE = ['./', './index.html', './manifest.webmanifest', './icon-192.png', './icon-512.png'];",
  "self.addEventListener('install', (e) => { e.waitUntil(caches.open(C).then((c) => c.addAll(CORE)).then(() => self.skipWaiting())); });",
  "self.addEventListener('activate', (e) => { e.waitUntil(caches.keys().then((k) => Promise.all(k.filter((x) => x !== C).map((x) => caches.delete(x)))).then(() => self.clients.claim())); });",
  "self.addEventListener('fetch', (e) => {",
  "  const r = e.request; if (r.method !== 'GET') return; const u = new URL(r.url);",
  "  if (u.origin === location.origin && (r.mode === 'navigate' || u.pathname.endsWith('.html'))) {",
  "    e.respondWith(fetch(r).then((res) => { const cp = res.clone(); caches.open(C).then((c) => c.put(r, cp)); return res; }).catch(() => caches.match(r).then((m) => m || caches.match('./index.html'))));",
  "    return;",
  "  }",
  "  e.respondWith(caches.match(r).then((m) => m || fetch(r).then((res) => { if (res.ok || res.type === 'opaque') { const cp = res.clone(); caches.open(C).then((c) => c.put(r, cp)); } return res; })));",
  "});",
].join('\n');

/* ---------- restore ---------- */
let RESTORE = null;
const RESTORE_COLS = ['profiles', 'weeks', 'logs', 'readiness', 'tests', 'gear', 'body', 'tech'];
async function handleRestore(file) {
  const out = $('#restore-out');
  try {
    const j = JSON.parse(await file.text());
    if (!RESTORE_COLS.some((c) => Array.isArray(j[c]))) throw new Error('This is not a ' + APP + ' backup file.');
    RESTORE = j;
    out.innerHTML = '<div class="panel stack small"><b>Backup from ' + esc((j.exported || '').slice(0, 10) || 'unknown date') + '</b><span>' + RESTORE_COLS.map((c) => (j[c] || []).length + ' ' + c).join(' · ') + '</span><span>Items with the same id are replaced; nothing else is deleted.</span><button class="btn sm primary" data-act="restore-go" style="align-self:flex-start">Restore now</button></div>';
  } catch (e) { out.innerHTML = '<p class="small" style="color:var(--bad)">' + esc(e.message) + '</p>'; }

async function restoreGo() {
  if (!RESTORE) return; const j = RESTORE; RESTORE = null; let n = 0;
  const jobs = [];
  RESTORE_COLS.forEach((c) => (j[c] || []).forEach((d) => { if (d && typeof d.id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(d.id)) jobs.push([c, d]); }));

}
